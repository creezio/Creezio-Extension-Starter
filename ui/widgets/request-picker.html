<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choix d’une demande</title><style>
:root{color-scheme:light;--ink:#14182f;--muted:#64748b;--line:#e3e1da;--paper:#fff;--wash:#faf7f1;--accent:#b8862f}
*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--wash);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,sans-serif}
main{display:grid;gap:12px;max-width:560px;margin:auto;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:0 6px 22px #14182f0b}
h1{margin:0;font-size:16px}small{color:var(--muted)}label{display:grid;gap:5px;font-weight:600}select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}
.selection{padding:10px;border-radius:8px;background:var(--wash)}.actions{display:flex;flex-wrap:wrap;gap:8px}
button{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.48;cursor:not-allowed}
#preview{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px;border-radius:8px;background:var(--wash)}#preview:empty{display:none}
output{display:block;min-height:1.3em;color:var(--muted)}
</style></head><body><main id="purchase-widget">
  <div><small>Demandes d’achat</small><h1>Choisir une demande</h1></div>
  <label>Demande<select id="request-select"><option value="">Aucune demande chargée</option></select></label>
  <div class="selection" id="selection">Sélectionnez une demande pour consulter son état.</div>
  <div class="actions"><button id="direct" type="button">Actualiser la liste</button>
    <button id="message" type="button">Préparer un message</button>
    <button id="context" type="button">Retenir la sélection</button>
    <button id="remove-context" type="button">Retirer du contexte</button></div>
  <div id="preview" aria-live="polite"></div><output id="status" role="status" aria-live="polite"></output>
</main></body></html>
